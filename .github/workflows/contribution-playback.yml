name: Refresh contribution playback

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-playback.yml
      - tools/build_contribution_playback.py

concurrency:
  group: contribution-playback-pages
  cancel-in-progress: false

permissions: {}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Render the public calendar
        run: |
          python3 -m venv "$RUNNER_TEMP/playback-venv"
          "$RUNNER_TEMP/playback-venv/bin/pip" install Pillow==12.3.0
          "$RUNNER_TEMP/playback-venv/bin/python" tools/build_contribution_playback.py --output _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    needs: render
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish contribution artwork
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
